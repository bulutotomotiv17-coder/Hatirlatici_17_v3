name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Projeyi bul ve derle
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then
            echo "HATA: settings.gradle.kts depoda yok. Proje dosyalari (app klasoru, settings.gradle.kts vb.) yuklenmemis."
            echo "Depodaki dosyalar:"; find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          cd "$(dirname "$F")"
          echo "Proje klasoru: $(pwd)"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hatirlatici-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
